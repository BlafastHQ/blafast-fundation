name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'tests/BASELINE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Matrix notes (task 4 / audit C8):
# - ubuntu only: the postgres service container is Linux-only, so the old
#   windows-latest legs died at "Initialize containers".
# - Laravel 12 only: spatie/laravel-permission ^7.1, spatie/laravel-query-builder
#   ^7.0 and laravel-json-api/laravel ^5.0 all hard-require ^12 — the old 11.*
#   legs could never resolve.
# - PHP 8.4 only: composer.json requires php ^8.4, so the old 8.3 legs could
#   never install either.
# - Pass criterion: tests/check-baseline.php — the failing set must be a SUBSET
#   of tests/BASELINE.md (the audit-known failures Phases 2-6 burn down); any
#   NEW failing test breaks the build.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [8.4]
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - L12 - ${{ matrix.stability }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blafast_fundation_test
          POSTGRES_USER: blafast
          POSTGRES_PASSWORD: blafast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "orchestra/testbench:10.*" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests (sqlite)
        run: |
          vendor/bin/pest --ci || true
          php tests/check-baseline.php build/report.junit.xml tests/BASELINE.md

      - name: Execute tests (Postgres)
        run: |
          vendor/bin/pest --ci || true
          php tests/check-baseline.php build/report.junit.xml tests/BASELINE.md
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_DATABASE: blafast_fundation_test
          DB_USERNAME: blafast
          DB_PASSWORD: blafast
